    stroke="#c8871f"
    stroke-width="16"
    stroke-linecap="round"
    stroke-opacity="0.95"
  />
  <circle cx="169" cy="209" r="16" fill="#fff6e8"/>
  <circle cx="343" cy="209" r="16" fill="#fff6e8"/>
  <circle cx="256" cy="214" r="15" fill="#4a7c5e"/>
  <circle cx="256" cy="214" r="7" fill="#fff6e8"/>
</svg>
