name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Start local infrastructure
        run: docker compose up -d

      - name: Wait for local infrastructure
        run: |
          for service in postgres redis; do
            container="$(docker compose ps -q "$service")"
            if [ -z "$container" ]; then
              echo "Service $service is not running"
              docker compose ps
              exit 1
            fi
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker logs "$container" || true
                echo "Service $service ($container) did not become healthy"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Start API gateway
        run: |
          pnpm --filter @weavenyc/api-gateway start > /tmp/weavenyc-api.log 2>&1 &
          echo $! > /tmp/weavenyc-api.pid

      - name: Real API smoke
        run: pnpm test:smoke:real

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm test:e2e

      - name: Dump API gateway log on failure
        if: failure()
        run: cat /tmp/weavenyc-api.log || true

      - name: Stop API gateway
        if: always()
        run: |
          if [ -f /tmp/weavenyc-api.pid ]; then
            kill "$(cat /tmp/weavenyc-api.pid)" || true
          fi

      - name: Stop local infrastructure
        if: always()
        run: docker compose down -v

  # F4-F5: promtool-check-rules guard. `infra/prometheus/rules/*.yaml`
  # is the source of truth for the pilot's alerting rules, but plain
  # YAML doesn't catch PromQL typos — a silently-never-firing alert
  # rule shipped to prod is a silent page-miss. Running `promtool check
  # rules` against every file in the directory on every PR surfaces
  # syntax errors + PromQL parse errors before merge.
  prom-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/prometheus/rules:/rules" \
            prom/prometheus:latest \
            promtool check rules /rules/*.yaml
