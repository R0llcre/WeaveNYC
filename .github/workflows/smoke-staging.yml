name: Smoke Staging

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Staging
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: smoke-staging
  cancel-in-progress: false

jobs:
  smoke-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    environment: staging

    env:
      WEAVENYC_DEPLOY_PROFILE: staging
      NODE_ENV: production
      WEAVENYC_STAGING_SMOKE_MODE: remote
      WEAVENYC_STAGING_RUN_REAL_API_SMOKE: "1"
      WEAVENYC_STAGING_RUN_P2P_SMOKE: "1"
      WEAVENYC_STAGING_API_GATEWAY_URL: ${{ vars.WEAVENYC_STAGING_API_GATEWAY_URL }}
      WEAVENYC_STAGING_POSTS_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_POSTS_SERVICE_URL }}
      WEAVENYC_STAGING_MATCH_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_MATCH_SERVICE_URL }}
      WEAVENYC_STAGING_CHAT_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_CHAT_SERVICE_URL }}
      WEAVENYC_STAGING_RESOURCE_DIRECTORY_URL: ${{ vars.WEAVENYC_STAGING_RESOURCE_DIRECTORY_URL }}
      WEAVENYC_STAGING_NOTIFICATIONS_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_NOTIFICATIONS_SERVICE_URL }}
      WEAVENYC_STAGING_PWA_URL: ${{ vars.WEAVENYC_STAGING_PWA_URL }}
      WEAVENYC_STAGING_ANCHOR_ADMIN_URL: ${{ vars.WEAVENYC_STAGING_ANCHOR_ADMIN_URL }}
      # Real-API smoke (spawned by smoke-staging.ts) mints ephemeral tokens and
      # signs requests; it needs the same runtime secrets the staging deploy uses.
      DATABASE_URL: ${{ secrets.WEAVENYC_STAGING_DATABASE_URL }}
      REDIS_URL: ${{ secrets.WEAVENYC_STAGING_REDIS_URL }}
      JWT_SIGNING_PRIVATE_KEY: ${{ secrets.WEAVENYC_STAGING_JWT_SIGNING_PRIVATE_KEY }}
      JWT_SIGNING_PUBLIC_KEY: ${{ secrets.WEAVENYC_STAGING_JWT_SIGNING_PUBLIC_KEY }}
      IDENTITY_HASH_PEPPER: ${{ secrets.WEAVENYC_STAGING_IDENTITY_HASH_PEPPER }}
      ANCHOR_TOTP_ENCRYPTION_KEY: ${{ secrets.WEAVENYC_STAGING_ANCHOR_TOTP_ENCRYPTION_KEY }}
      INTERNAL_SERVICE_JWT_SECRET: ${{ secrets.WEAVENYC_STAGING_INTERNAL_SERVICE_JWT_SECRET }}
      POSTS_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_POSTS_SERVICE_URL }}
      MATCH_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_MATCH_SERVICE_URL }}
      CHAT_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_CHAT_SERVICE_URL }}
      RESOURCE_DIRECTORY_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_RESOURCE_DIRECTORY_URL }}
      NOTIFICATIONS_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_NOTIFICATIONS_SERVICE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # smoke-staging.ts spawns `pnpm test:smoke:real` which imports
      # `@weavenyc/shared` from api-gateway's resolved workspace. The shared
      # dist needs to exist before the spawn — same pattern as deploy-pwa/admin.
      - name: Build workspace dependencies
        run: pnpm --filter @weavenyc/shared --filter @weavenyc/db --filter @weavenyc/test-utils build

      - name: Run staging smoke
        run: pnpm exec tsx scripts/staging/smoke-staging.ts

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-report
          path: .staging/smoke-report.json
          if-no-files-found: error
