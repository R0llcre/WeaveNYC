name: Deploy Anchor Admin

# A8 P0-6 freshness invariant for Cloudflare Pages:
# Every run asserts post-deploy that the `weavenyc-anchor-admin` CF Pages
# project's latest production deployment (a) was `created_on` within
# 5 minutes, and (b) its `deployment_trigger.metadata.commit_hash` starts
# with the GitHub SHA that just ran. If either fails, the workflow errors
# out — closing the silent-no-op hole where `wrangler pages deploy`
# reports success but CF actually rolled the build to a preview branch or
# kept production pointed at the prior commit.

on:
  push:
    branches: [main]
    paths:
      - 'apps/anchor-admin/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'packages/test-utils/**'
      - '.github/workflows/deploy-admin.yml'
      - 'scripts/staging/post-deploy-smoke.ts'
  workflow_dispatch:
    inputs:
      enforce_go_live:
        description: "PILOT GO-LIVE: fail if docs/11_Ops_Runbook.md still has on-call placeholders. Set to 'true' only when flipping pilot live."
        required: false
        default: "false"

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: On-call placeholder check (warn on push, block on release)
        # Warn for push events; block only when workflow_dispatch is invoked
        # with `enforce_go_live=true`. Rationale + invocation in
        # deploy-api.yml comment block.
        continue-on-error: ${{ github.event_name == 'push' || github.event.inputs.enforce_go_live != 'true' }}
        run: |
          if grep -nE '^\| .*<primary>|^\| .*<secondary>|^\| .*<escalation>' docs/11_Ops_Runbook.md; then
            echo "::warning::docs/11_Ops_Runbook.md still has on-call placeholders — fill before PILOT GO-LIVE"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @weavenyc/shared --filter @weavenyc/db --filter @weavenyc/test-utils build
      - name: Build Anchor Admin
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.weavenyc.org
        run: pnpm --filter @weavenyc/anchor-admin build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy apps/anchor-admin/out \
            --project-name=weavenyc-anchor-admin --branch=main --commit-dirty=true
      - name: Post-deploy smoke — assert FRESH CF Pages publish
        # A8 P0-6 freshness gate for Cloudflare Pages. See script header
        # for the exact assertions; both the age (< 5min) and the commit
        # hash (prefix match on GITHUB_SHA) must pass.
        env:
          MODE: cf-pages
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT_NAME: weavenyc-anchor-admin
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          MAX_AGE_SECONDS: "300"
        run: |
          pnpm exec tsx scripts/staging/post-deploy-smoke.ts
