name: Deploy Anchor Admin

on:
  push:
    branches: [main]
    paths:
      - 'apps/anchor-admin/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'packages/test-utils/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @weavenyc/shared --filter @weavenyc/db --filter @weavenyc/test-utils build
      - name: Build Anchor Admin
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.weavenyc.org
        run: pnpm --filter @weavenyc/anchor-admin build
      - name: Deploy to Cloudflare Pages
        env:
          CF_OAUTH_TOKEN: ${{ secrets.CF_OAUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # See deploy-pwa.yml for the OAuth-config-file rationale.
        run: |
          mkdir -p "$RUNNER_TEMP/wr/.wrangler/config"
          cat > "$RUNNER_TEMP/wr/.wrangler/config/default.toml" <<EOF
          oauth_token = "$CF_OAUTH_TOKEN"
          expiration_time = "2099-01-01T00:00:00.000Z"
          refresh_token = "noop"
          scopes = ["pages:write", "account:read", "user:read"]
          EOF
          WRANGLER_HOME="$RUNNER_TEMP/wr" pnpm exec wrangler pages deploy apps/anchor-admin/out \
            --project-name=weavenyc-anchor-admin --branch=main --commit-dirty=true
