name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan or apply deploy staging"
        required: false
        type: choice
        default: plan
        options:
          - plan
          - apply
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging

    env:
      WEAVENYC_DEPLOY_PROFILE: staging
      # Plan-only until the apply-webhook (DEPLOY_HOOK_URL) is provisioned.
      # Re-enable `apply` by changing this expression once the webhook endpoint exists.
      WEAVENYC_STAGING_DEPLOY_MODE: ${{ github.event.inputs.mode || 'plan' }}
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: ${{ secrets.WEAVENYC_STAGING_DATABASE_URL }}
      REDIS_URL: ${{ secrets.WEAVENYC_STAGING_REDIS_URL }}
      JWT_SIGNING_PRIVATE_KEY: ${{ secrets.WEAVENYC_STAGING_JWT_SIGNING_PRIVATE_KEY }}
      JWT_SIGNING_PUBLIC_KEY: ${{ secrets.WEAVENYC_STAGING_JWT_SIGNING_PUBLIC_KEY }}
      IDENTITY_HASH_PEPPER: ${{ secrets.WEAVENYC_STAGING_IDENTITY_HASH_PEPPER }}
      ANCHOR_TOTP_ENCRYPTION_KEY: ${{ secrets.WEAVENYC_STAGING_ANCHOR_TOTP_ENCRYPTION_KEY }}
      INTERNAL_SERVICE_JWT_SECRET: ${{ secrets.WEAVENYC_STAGING_INTERNAL_SERVICE_JWT_SECRET }}
      P2P_MDNS_DEMO_ENABLED: "0"
      NEXT_PUBLIC_P2P_MDNS_DEMO_ENABLED: "0"
      POSTS_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_POSTS_SERVICE_URL }}
      MATCH_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_MATCH_SERVICE_URL }}
      CHAT_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_CHAT_SERVICE_URL }}
      RESOURCE_DIRECTORY_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_RESOURCE_DIRECTORY_URL }}
      NOTIFICATIONS_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_NOTIFICATIONS_SERVICE_URL }}
      WEAVENYC_STAGING_API_GATEWAY_URL: ${{ vars.WEAVENYC_STAGING_API_GATEWAY_URL }}
      WEAVENYC_STAGING_POSTS_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_POSTS_SERVICE_URL }}
      WEAVENYC_STAGING_MATCH_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_MATCH_SERVICE_URL }}
      WEAVENYC_STAGING_CHAT_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_CHAT_SERVICE_URL }}
      WEAVENYC_STAGING_RESOURCE_DIRECTORY_URL: ${{ vars.WEAVENYC_STAGING_RESOURCE_DIRECTORY_URL }}
      WEAVENYC_STAGING_NOTIFICATIONS_SERVICE_URL: ${{ vars.WEAVENYC_STAGING_NOTIFICATIONS_SERVICE_URL }}
      WEAVENYC_STAGING_PWA_URL: ${{ vars.WEAVENYC_STAGING_PWA_URL }}
      WEAVENYC_STAGING_ANCHOR_ADMIN_URL: ${{ vars.WEAVENYC_STAGING_ANCHOR_ADMIN_URL }}
      NOTIFICATIONS_DEMO_BASE_URL: ${{ vars.WEAVENYC_STAGING_NOTIFICATIONS_DEMO_BASE_URL }}
      TWILIO_ACCOUNT_SID: ${{ secrets.WEAVENYC_STAGING_TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.WEAVENYC_STAGING_TWILIO_AUTH_TOKEN }}
      TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.WEAVENYC_STAGING_TWILIO_MESSAGING_SERVICE_SID }}
      RESEND_API_KEY: ${{ secrets.WEAVENYC_STAGING_RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.WEAVENYC_STAGING_RESEND_FROM_EMAIL }}
      AWS_REGION: ${{ vars.WEAVENYC_STAGING_AWS_REGION }}
      GCP_PROJECT_ID: ${{ vars.WEAVENYC_STAGING_GCP_PROJECT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.WEAVENYC_STAGING_AZURE_SUBSCRIPTION_ID }}
      VERCEL_TOKEN: ${{ secrets.WEAVENYC_STAGING_VERCEL_TOKEN }}
      WEAVENYC_STAGING_DEPLOY_HOOK_URL: ${{ secrets.WEAVENYC_STAGING_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployable artifacts
        run: pnpm build

      - name: Plan or apply staging deploy
        run: pnpm exec tsx scripts/staging/deploy-staging.ts

      - name: Upload deploy plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-plan
          path: .staging/*.json
          if-no-files-found: error
          include-hidden-files: true
