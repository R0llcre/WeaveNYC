name: Refresh Resource Directory

# The GitHub runner fetches no database credentials. A short-lived ECS task
# uses the approved production shared database through its existing VPC rule.
# The task's default command is read-only; this workflow requests sync only
# after the import gate is enabled. Pushes to the repair branch run preflight.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run a read-only preflight or import the official sources
        type: choice
        options:
          - preflight
          - sync
        default: sync
  push:
    branches:
      - fix/cfc-active-pdf-parsing-20261001
    paths:
      - .github/workflows/refresh-resources.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: refresh-resources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: weavenyc-resource-import
      ECS_TASK_DEFINITION: weavenyc-resource-importer

    steps:
      - name: Select mode and enforce import gate
        id: gate
        shell: bash
        env:
          ENABLE_RESOURCE_IMPORTS: ${{ secrets.ENABLE_RESOURCE_IMPORTS }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=preflight
          else
            mode="${REQUESTED_MODE:-sync}"
          fi
          if [[ "$mode" != preflight && "$mode" != sync ]]; then
            echo "::error::Unsupported import mode"
            exit 1
          fi
          if [[ "$ENABLE_RESOURCE_IMPORTS" == 1 ]]; then
            echo "import_gate_enabled=true"
          else
            echo "import_gate_enabled=false"
          fi
          if [[ "$mode" == sync && "$ENABLE_RESOURCE_IMPORTS" != 1 ]]; then
            echo "::error::ENABLE_RESOURCE_IMPORTS must equal 1 before a database import"
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Assume scoped resource import role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590517422743:role/weavenyc-github-resource-import
          aws-region: us-east-1
          role-session-name: weavenyc-resource-import

      - name: Run ECS import task and inspect final exit code
        shell: bash
        env:
          IMPORT_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -euo pipefail
          task_arn=""
          cleanup() {
            if [[ -z "$task_arn" ]]; then return; fi
            status="$(aws ecs describe-tasks --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" --query 'tasks[0].lastStatus' --output text 2>/dev/null || true)"
            if [[ "$status" != STOPPED && "$status" != None ]]; then
              aws ecs stop-task --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
                --task "$task_arn" --reason "Workflow finished before importer task" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          override=()
          if [[ "$IMPORT_MODE" == sync ]]; then
            override=(--overrides '{"containerOverrides":[{"name":"importer","command":["node","services/resource-directory/dist/src/cli.js","sync"]}]}')
          fi
          task_arn="$(aws ecs run-task --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_TASK_DEFINITION" --launch-type FARGATE \
            --network-configuration 'awsvpcConfiguration={subnets=[subnet-0215d6c92eefc6835,subnet-023bf2bdb986a6201],securityGroups=[sg-067b3f6099eb8f5f5],assignPublicIp=ENABLED}' \
            --started-by weavenyc-resource-refresh --propagate-tags TASK_DEFINITION \
            "${override[@]}" --query 'tasks[0].taskArn' --output text)"
          if [[ -z "$task_arn" || "$task_arn" == None ]]; then
            echo "::error::ECS did not start an importer task"
            exit 1
          fi
          echo "ECS task: $task_arn"

          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            status="$(aws ecs describe-tasks --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" --query 'tasks[0].lastStatus' --output text)"
            if [[ "$status" == STOPPED ]]; then
              exit_code="$(aws ecs describe-tasks --region "$AWS_REGION" --cluster "$ECS_CLUSTER" \
                --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)"
              if [[ "$exit_code" == 0 ]]; then
                echo "Importer task completed successfully"
                exit 0
              fi
              echo "::error::Importer task exited with code $exit_code"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Importer task exceeded 30 minutes; stopping it"
          exit 1
