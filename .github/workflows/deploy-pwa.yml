name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - 'apps/pwa/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'packages/test-utils/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @weavenyc/shared --filter @weavenyc/db --filter @weavenyc/test-utils build
      - name: Build PWA
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.weavenyc.org
        run: pnpm --filter @weavenyc/pwa build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy apps/pwa/out \
            --project-name=weavenyc-pwa --branch=main --commit-dirty=true
