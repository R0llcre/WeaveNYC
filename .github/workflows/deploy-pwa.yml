name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - 'apps/pwa/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'packages/test-utils/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @weavenyc/shared --filter @weavenyc/db --filter @weavenyc/test-utils build
      - name: Build PWA
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.weavenyc.org
        run: pnpm --filter @weavenyc/pwa build
      - name: Deploy to Cloudflare Pages
        env:
          CF_OAUTH_TOKEN: ${{ secrets.CF_OAUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The repo-scoped token is an OAuth-issued wrangler token (pages:write
        # among other scopes). It validates via wrangler's OAuth config file
        # path, not CLOUDFLARE_API_TOKEN (which requires a separately issued
        # API token from the dashboard). Materialize a minimal TOML config
        # pointing WRANGLER_HOME at a throwaway dir, then invoke wrangler
        # directly — the root-level wrangler dev dep makes `pnpm exec` work.
        run: |
          mkdir -p "$RUNNER_TEMP/wr/.wrangler/config"
          cat > "$RUNNER_TEMP/wr/.wrangler/config/default.toml" <<EOF
          oauth_token = "$CF_OAUTH_TOKEN"
          expiration_time = "2099-01-01T00:00:00.000Z"
          refresh_token = "noop"
          scopes = ["pages:write", "account:read", "user:read"]
          EOF
          WRANGLER_HOME="$RUNNER_TEMP/wr" pnpm exec wrangler pages deploy apps/pwa/out \
            --project-name=weavenyc-pwa --branch=main --commit-dirty=true
