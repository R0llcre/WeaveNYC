name: Deploy PWA

# A8 P0-6 freshness invariant for Cloudflare Pages:
# Every run asserts post-deploy that the `weavenyc-pwa` CF Pages
# project's latest production deployment (a) was `created_on` within
# 5 minutes, and (b) its `deployment_trigger.metadata.commit_hash` starts
# with the GitHub SHA that just ran. If either fails, the workflow errors
# out — closing the silent-no-op hole where `wrangler pages deploy`
# reports success but CF actually rolled the build to a preview branch or
# kept production pointed at the prior commit.

on:
  push:
    branches: [main]
    paths:
      - 'apps/pwa/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'packages/test-utils/**'
      - '.github/workflows/deploy-pwa.yml'
      - 'scripts/staging/post-deploy-smoke.ts'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @weavenyc/shared --filter @weavenyc/db --filter @weavenyc/test-utils build
      - name: Build PWA
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.weavenyc.org
          # SENTRY_AUTH_TOKEN triggers `withSentryConfig` to upload
          # sourcemaps during `next build`. A missing/empty token is a
          # no-op — the build still succeeds and ships without symbolicated
          # traces. See apps/pwa/SENTRY.md for provisioning.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm --filter @weavenyc/pwa build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy apps/pwa/out \
            --project-name=weavenyc-pwa --branch=main --commit-dirty=true
      - name: Post-deploy smoke — assert FRESH CF Pages publish
        # A8 P0-6 freshness gate for Cloudflare Pages. See script header
        # for the exact assertions; both the age (< 5min) and the commit
        # hash (prefix match on GITHUB_SHA) must pass.
        env:
          MODE: cf-pages
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT_NAME: weavenyc-pwa
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          MAX_AGE_SECONDS: "300"
        run: |
          pnpm exec tsx scripts/staging/post-deploy-smoke.ts
